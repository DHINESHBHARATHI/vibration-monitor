<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "Alza",
  authDomain: "vehiclemonitoring-79d39.firebaseapp.com",
  databaseURL: "https://vehiclemonitoring-79d39-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vehiclemonitoring-79d39",
  storageBucket: "vehiclemonitoring-79d39.firebasestorage.app",
  messagingSenderId: "897921009271",
  appId: "1:897921009271:web:be466282f26bb94a776872"
};

firebase.initializeApp(firebaseConfig);

firebase.database().ref("/").on("value", function(snapshot){

  var data = snapshot.val();

  document.getElementById("status").innerHTML = data.status;

  if(data.status == "HIGH VIBRATION DETECTED")
  {
    document.getElementById("latitude").innerHTML =
    data.latitude;

    document.getElementById("longitude").innerHTML =
    data.longitude;

    document.getElementById("mapLink").style.display =
    "inline";

    document.getElementById("mapLink").href =
    "https://maps.google.com/?q=" +
    data.latitude + "," + data.longitude;
  }
  else
  {
    document.getElementById("latitude").innerHTML =
    "Hidden";

    document.getElementById("longitude").innerHTML =
    "Hidden";

    document.getElementById("mapLink").style.display =
    "none";
  }

});
</script>
