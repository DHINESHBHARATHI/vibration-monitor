<!DOCTYPE html>
<html>
<head>
<title>Vehicle Monitoring System</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f2f2f2;
}

.card{
  background:white;
  width:500px;
  margin:auto;
  margin-top:50px;
  padding:20px;
  border-radius:10px;
  box-shadow:0px 0px 10px gray;
}
</style>
</head>

<body>

<div class="card">

<h1>🚗 Vehicle Monitoring System</h1>

<h2>Status</h2>
<h3 id="status">Loading...</h3>

<h2>Latitude</h2>
<p id="latitude">Loading...</p>

<h2>Longitude</h2>
<p id="longitude">Loading...</p>

<a id="mapLink" href="#" target="_blank">
📍 Open Location in Google Maps
</a>

</div>

<script>

const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "vehiclemonitoring-79d39.firebaseapp.com",
  databaseURL: "https://vehiclemonitoring-79d39-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vehiclemonitoring-79d39",
  storageBucket: "vehiclemonitoring-79d39.firebasestorage.app",
  messagingSenderId: "897921009271",
  appId: "1:897921009271:web:be466282f26bb94a776872"
};

firebase.initializeApp(firebaseConfig);

firebase.database().ref("/").on("value", function(snapshot){

  var data = snapshot.val();

  document.getElementById("status").innerHTML = data.status;

  if(data.status == "HIGH VIBRATION DETECTED")
  {
    document.getElementById("latitude").innerHTML = data.latitude;
    document.getElementById("longitude").innerHTML = data.longitude;

    document.getElementById("mapLink").style.display = "inline";

    document.getElementById("mapLink").href =
      "https://maps.google.com/?q=" +
      data.latitude + "," + data.longitude;
  }
  else
  {
    document.getElementById("latitude").innerHTML = "Hidden";
    document.getElementById("longitude").innerHTML = "Hidden";
    document.getElementById("mapLink").style.display = "none";
  }
});

</script>

</body>
</html>
